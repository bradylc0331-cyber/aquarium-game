<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>河道校正工具</title>
<style>
  :root { color-scheme: light; }
  body { margin: 0; font: 15px/1.5 -apple-system, "PingFang TC", "Microsoft JhengHei", sans-serif;
         background: #14213d; color: #eef4fb; }
  header { padding: 10px 14px; background: #0d1b33; }
  h1 { font-size: 16px; margin: 0 0 4px; }
  p { margin: 0; font-size: 13px; color: #a9bcd8; }
  #wrap { position: relative; line-height: 0; }
  canvas { display: block; max-width: 100%; cursor: crosshair; }
  #panel { padding: 12px 14px; }
  button { font: inherit; padding: 7px 14px; border: none; border-radius: 8px;
           background: #2f6fed; color: #fff; cursor: pointer; margin-right: 8px; }
  button.sec { background: #3a4a6b; }
  textarea { width: 100%; height: 190px; margin-top: 10px; font: 13px/1.5 ui-monospace, Menlo, monospace;
             background: #0d1b33; color: #9ff; border: 1px solid #33507f; border-radius: 8px; padding: 10px; }
  .hint { color: #ffd479; }
</style>
</head>
<body>
<header>
  <h1>河道校正工具</h1>
  <p>沿著河，<span class="hint">先點左岸、再點右岸</span>，一組一組往下游點。每點一組會畫出一段河道帶。
     點錯按「退回上一點」。點完把下面那段文字整段複製給我就好。</p>
</header>
<div id="wrap"><canvas id="cv"></canvas></div>
<div id="panel">
  <button id="undo" class="sec">← 退回上一點</button>
  <button id="clear" class="sec">全部清掉</button>
  <button id="toggle" class="sec">顯示／隱藏目前程式用的河道</button>
  <span id="count"></span>
  <textarea id="out" readonly placeholder="點了之後這裡會出現座標"></textarea>
</div>
<script src="src/constants.js"></script>
<script src="src/scene.js"></script>
<script>
(function () {
  const cv = document.getElementById('cv');
  const ctx = cv.getContext('2d');
  const out = document.getElementById('out');
  const countEl = document.getElementById('count');
  const img = new Image();
  // 一次點擊存一個 {nx, ny}；兩個一組（左岸、右岸）
  const clicks = [];
  let showCurrent = true;

  img.onload = () => {
    // 塞進視窗，但不要超過原圖解析度
    const maxW = Math.min(window.innerWidth, img.width);
    const scale = maxW / img.width;
    cv.width = Math.round(img.width * scale);
    cv.height = Math.round(img.height * scale);
    draw();
  };
  img.onerror = () => {
    document.body.insertAdjacentHTML('beforeend',
      '<p style="padding:14px;color:#ff9">讀不到 assets/backgrounds/bible-world.png，' +
      '請確認是用 http://localhost:8933/river-calibrate.html 開啟，不是直接按兩下檔案。</p>');
  };
  img.src = 'assets/backgrounds/bible-world.png';

  function pairs() {
    const list = [];
    for (let i = 0; i + 1 < clicks.length; i += 2) {
      const a = clicks[i], b = clicks[i + 1];
      list.push({
        nx: (a.nx + b.nx) / 2,
        ny: (a.ny + b.ny) / 2,
        halfWidth: Math.abs(b.nx - a.nx) / 2,
      });
    }
    return list;
  }

  function draw() {
    ctx.clearRect(0, 0, cv.width, cv.height);
    ctx.drawImage(img, 0, 0, cv.width, cv.height);
    const toPx = (nx, ny) => [nx * cv.width, ny * cv.height];

    // 目前程式用的河道帶（青色），方便對照
    if (showCurrent && window.AquariumScene && AquariumScene.riverPoint) {
      const L = [], R = [];
      for (let p = 0; p <= 1.0001; p += 0.005) {
        const r = AquariumScene.riverPoint(p);
        const hw = AquariumScene.riverHalfWidth ? AquariumScene.riverHalfWidth(p) : 0.01;
        L.push(toPx(r.nx - hw, r.ny));
        R.push(toPx(r.nx + hw, r.ny));
      }
      ctx.fillStyle = 'rgba(0,220,255,0.30)';
      ctx.beginPath();
      L.forEach((p, i) => (i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1])));
      for (let i = R.length - 1; i >= 0; i--) ctx.lineTo(R[i][0], R[i][1]);
      ctx.closePath();
      ctx.fill();
    }

    // 量出來的河道帶（洋紅）
    const list = pairs();
    if (list.length >= 2) {
      ctx.fillStyle = 'rgba(255,0,140,0.40)';
      ctx.beginPath();
      list.forEach((s, i) => { const [x, y] = toPx(s.nx - s.halfWidth, s.ny); i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); });
      for (let i = list.length - 1; i >= 0; i--) { const [x, y] = toPx(list[i].nx + list[i].halfWidth, list[i].ny); ctx.lineTo(x, y); }
      ctx.closePath();
      ctx.fill();
    }

    // 每一次點擊的記號：左岸黃、右岸綠
    clicks.forEach((c, i) => {
      const [x, y] = toPx(c.nx, c.ny);
      ctx.fillStyle = i % 2 === 0 ? '#ffe600' : '#4dff88';
      ctx.beginPath(); ctx.arc(x, y, 4, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#000'; ctx.lineWidth = 1; ctx.stroke();
    });

    const half = Math.floor(clicks.length / 2);
    countEl.textContent = `已點 ${clicks.length} 次＝${half} 組` +
      (clicks.length % 2 ? '（這一組還差右岸）' : '');
    out.value = list.length
      ? '  const RIVER_PATH = [\n' +
        list.map((s) => `    [${s.nx.toFixed(3)}, ${s.ny.toFixed(3)}, ${s.halfWidth.toFixed(4)}],`).join('\n') +
        '\n  ];'
      : '';
  }

  cv.addEventListener('click', (e) => {
    const rect = cv.getBoundingClientRect();
    clicks.push({
      nx: (e.clientX - rect.left) / rect.width,
      ny: (e.clientY - rect.top) / rect.height,
    });
    draw();
  });
  document.getElementById('undo').onclick = () => { clicks.pop(); draw(); };
  document.getElementById('clear').onclick = () => { clicks.length = 0; draw(); };
  document.getElementById('toggle').onclick = () => { showCurrent = !showCurrent; draw(); };
})();
</script>
</body>
</html>
