<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>列印：A4 QR 聖經人物著色頁</title>
<style>
  body { margin: 0; font: 15px/1.6 -apple-system, "PingFang TC", "Microsoft JhengHei", sans-serif; color: #14213d; background: #eef4fb; }
  .toolbar { padding: 16px; background: #fff; box-shadow: 0 2px 8px rgba(0,0,0,0.06); position: sticky; top: 0; z-index: 10; }
  .toolbar button { font: inherit; padding: 8px 16px; border-radius: 8px; border: none; background: #2f6fed; color: #fff; cursor: pointer; }
  .toolbar p { margin: 8px 0 0; font-size: 13px; color: #46587a; }
  .sheet {
    background: #fff; margin: 24px auto; box-shadow: 0 2px 12px rgba(0,0,0,0.1);
    padding: 0; width: 297mm; height: 210mm; box-sizing: border-box; page-break-after: always;
  }
  .sheet .screen-caption { padding: 8px 12px; background: #eef4fb; font-weight: 700; }
  .sheet svg { display: block; width: 297mm; height: 210mm; border: 1px solid #ccc; box-sizing: border-box; }
  @media print {
    @page { size: A4 landscape; margin: 0; }
    .toolbar { display: none; }
    body { background: #fff; }
    .sheet { box-shadow: none; margin: 0; }
    .sheet .screen-caption { display: none; }
    .sheet svg { border: none; }
  }
</style>
</head>
<body>
<div class="toolbar">
  <button onclick="window.print()">🖨️ 列印全部</button>
  <p>每頁都是一張完整 A4 橫式著色頁，紙張下緣印有該人物最為人熟知的經文。列印請選「A4、橫向、100%／實際大小」，不要選「符合頁面」。四角黑色方塊和上方 QR Code 都要完整印出，作品完成後整張直接放到攝影機下，不用裁剪。</p>
</div>

<script src="../src/constants.js"></script>
<script src="../src/species.js"></script>
<script src="../src/qrCode.js"></script>
<script src="../src/printLayout.js"></script>
<script>
(function () {
  const { CANVAS_W, CANVAS_H, WORK_AREA, MARKER_CANONICAL, MARKER_INSET, MARKER_SIZE, QR_AREA, PRINT_MM_PER_PX } = AquariumConstants;
  const root = document.currentScript.parentElement;

  const { layoutVerseBand, VERSE_REF_SIZE } = PrintLayout;

  function speciesPrintSVG(species) {
    const verseBand = layoutVerseBand(species);
    const { x0, y0, x1, y1 } = WORK_AREA;
    const w = x1 - x0, h = y1 - y0;
    const wmm = (CANVAS_W * PRINT_MM_PER_PX).toFixed(1);
    const hmm = (CANVAS_H * PRINT_MM_PER_PX).toFixed(1);
    const scale = w / 400;
    const half = MARKER_SIZE / 2;
    const squares = Object.values(MARKER_CANONICAL).map(([x, y]) =>
      `<rect x="${x - half}" y="${y - half}" width="${MARKER_SIZE}" height="${MARKER_SIZE}" rx="1.5" fill="#000"/>`
    ).join('');
    const shapesMarkup = species.shapes.map((s) => {
      const attrs = Object.entries(s.attrs).map(([k, v]) => `${k}="${v}"`).join(' ');
      const strokeW = s.type === 'line' ? (s.lineWidth || 16) : 6;
      return `<${s.tag} ${attrs} fill="none" stroke="#111" stroke-width="${strokeW}" stroke-linecap="round" stroke-linejoin="round"/>`;
    }).join('');
    const artwork = species.art
      ? `<image href="../${species.art}" x="${x0}" y="${y0}" width="${w}" height="${h}" preserveAspectRatio="xMidYMid meet"/>`
      : `<g transform="translate(${x0} ${y0}) scale(${scale})">${shapesMarkup}</g>`;
    const qrText = `BIBLE:${species.id.toUpperCase()}`;
    return `<svg xmlns="http://www.w3.org/2000/svg" width="${wmm}mm" height="${hmm}mm" viewBox="0 0 ${CANVAS_W} ${CANVAS_H}">
      <rect width="100%" height="100%" fill="#fff"/>
      <text x="72" y="48" font-size="26" font-weight="700" fill="#222" font-family="sans-serif">${species.emoji} ${species.name}</text>
      <text x="480" y="35" font-size="13" fill="#555" font-family="sans-serif">QR 自動辨識區</text>
      <text x="480" y="55" font-size="13" fill="#a23b2a" font-family="sans-serif">請勿塗畫或遮住四角方塊</text>
      ${BibleQrCode.svgMarkup(qrText, QR_AREA.x, QR_AREA.y, QR_AREA.size)}
      <rect x="${x0}" y="${y0}" width="${w}" height="${h}" fill="#fff"/>
      ${artwork}
      <rect x="${x0}" y="${y0}" width="${w}" height="${h}" fill="none" stroke="#ddd" stroke-width="1.5"/>
      ${squares}
      <text x="${verseBand.centerX}" y="558" font-size="${verseBand.fontSize}" font-weight="600" fill="#333" text-anchor="middle" font-family="sans-serif">「${species.verse}」</text>
      <text x="${verseBand.refX}" y="558" font-size="${VERSE_REF_SIZE}" fill="#888" text-anchor="end" font-family="sans-serif">${species.verseRef}</text>
    </svg>`;
  }

  function addSheet(title, svgString) {
    const div = document.createElement('div');
    div.className = 'sheet';
    div.innerHTML = `<div class="screen-caption">${title}</div>${svgString}`;
    root.appendChild(div);
  }

  for (const species of Species.SPECIES) {
    addSheet(`${species.emoji} ${species.name}　「${species.verse}」${species.verseRef}`, speciesPrintSVG(species));
  }
})();
</script>
</body>
</html>
