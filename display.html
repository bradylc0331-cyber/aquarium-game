<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>聖經樂園</title>
<style>
  html, body { margin: 0; padding: 0; background: #d9ae68; overflow: hidden; height: 100%; }
  canvas { display: block; }
  #hint {
    position: fixed; left: 16px; bottom: 12px; color: rgba(255,255,255,0.55);
    font: 14px/1.4 -apple-system, "PingFang TC", "Microsoft JhengHei", sans-serif;
    pointer-events: none; user-select: none;
  }
  #toast {
    position: fixed; top: 24px; left: 50%; transform: translateX(-50%) translateY(-20px);
    background: rgba(255,252,242,0.94); color: #775128; padding: 10px 22px; border-radius: 999px;
    font: bold 20px/1 -apple-system, "PingFang TC", "Microsoft JhengHei", sans-serif;
    opacity: 0; transition: opacity .3s, transform .3s; pointer-events: none;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
<canvas id="tank"></canvas>
<div id="toast"></div>
<div id="hint">按 F11 進入全螢幕投影到電視 · 這個視窗保持開著</div>

<script src="src/constants.js"></script>
<script src="src/species.js"></script>
<script src="src/svgRaster.js"></script>
<script src="src/extract.js"></script>
<script src="src/movement.js"></script>
<script src="src/flight.js"></script>
<script src="src/creature.js"></script>
<script src="src/characterManager.js"></script>
<script src="src/scene.js"></script>
<script src="src/artworkMessage.js"></script>
<script src="src/channel.js"></script>
<script src="src/artworkStore.js"></script>
<script>
(function () {
  const canvas = document.getElementById('tank');
  const ctx = canvas.getContext('2d');
  const toast = document.getElementById('toast');

  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resize);
  resize();

  const bubbles = AquariumScene.createBubbles(canvas.width, canvas.height, 40);
  const sheepFlock = AquariumScene.createSheepFlock(canvas.width, canvas.height);
  const birdFlock = AquariumScene.createBirdFlock(canvas.width, canvas.height);
  // 可行走區在每一幀重算（視窗會被縮放）。
  let walkable = Movement.getWalkableArea(canvas.width, canvas.height);
  // 天空帶：會飛的角色在這裡飄，完全不跟地面角色搶位子。
  let sky = Flight.getSkyArea(canvas.width, canvas.height);

  // 規格：畫面最多同時 15 位；第 16 位進場時第 1 位先淡出，依 FIFO 循環。
  // 掃描失敗或找不到安全入口的作品留在 pending，不占名額也不淘汰場上角色。
  const manager = new CharacterManagerModule.CharacterManager({
    maxCharacters: 15,
    exitSeconds: 0.4,
    createCharacter(work) {
      const species = Species.getSpecies(work.speciesId);
      if (!species || !work.image) return null;
      // 出生檢查要用**碰撞**尺寸（最近景的大小），不能用某個景深下的繪製尺寸。
      // 否則角色往下走變大之後就會突然重疊，每一幀都觸發完整復位搜尋。
      const size = CreatureModule.collisionSize(work.image, canvas.width, canvas.height);
      // 會飛的角色從天空進場，跟地面完全分開；地面擠不擠跟牠無關。
      const flying = !(species.swim.style === 'walk' || species.swim.grounded === true);
      // 地面的入口只跟**地面角色**擠——飛行角色不算進地面的擁擠度，
      // 這一條規格在移動迴圈裡有做（walkers/flyers 分開），入口這裡先前漏了：
      // 傳整個 renderable 進去，等於讓天上的天使去擋地面的入口。
      // 目前的高度差還蓋得住（天使的 baseY 離最近的地面候選點至少 226px，
      // 而兩者的 radiusY 加起來只有 78px），但那是碰巧，不是設計。
      const spawn = flying
        ? Flight.findSkySpawn(size, manager.renderable.filter((c) => c.isFlying), sky)
        : Movement.findSafeSpawn(size, manager.renderable.filter((c) => !c.isFlying), walkable);
      if (!spawn) return null; // 沒有位子就留在 pending 等空間，不縮小也不重疊
      return new CreatureModule.Creature({
        artworkId: work.artworkId,
        image: work.image,
        species,
        canvasWidth: canvas.width,
        canvasHeight: canvas.height,
        spawn,
        isDemo: work.isDemo === true,
        groundTop: walkable.top,
        groundBottom: walkable.bottom,
      });
    },
  });
  const creatures = manager.renderable;

  // 唯讀的驗收掛勾。Task 8 要能用數字確認「場上幾位、誰被替換掉、還有幾張在等」，
  // 光靠截圖數人頭數不準（角色會互相遮擋）。只讀不寫，不影響正常流程。
  window.__bibleDebug = {
    characterCount: () => manager.renderable.length,
    artworkIds: () => manager.renderable.map((c) => c.artworkId),
    pendingCount: () => manager.pendingCount,
    positions: () => manager.renderable.map((c) => ({ id: c.artworkId, x: c.x, baseY: c.baseY })),
    flockCounts: () => ({ sheep: sheepFlock.length, birds: birdFlock.length }),
    sheepPositions: () => sheepFlock.map((sheep) => ({ x: sheep.x, baseY: sheep.baseY, mode: sheep.mode })),
    birdPositions: () => birdFlock.map((bird) => ({ x: bird.x, y: bird.y, phase: bird.phase })),
    // 飛行角色要能單獨檢查：截圖看不出「頭頂被畫面上緣切掉幾像素」，
    // 也看不出天使到底有沒有在飄——牠飄得慢，兩張相隔很久的截圖看起來會一樣。
    flyers: () => manager.renderable.filter((c) => c.isFlying).map((c) => ({
      id: c.artworkId, x: c.x, baseY: c.baseY,
      renderHeight: c.renderHeight, amplitude: c.amplitude,
      driftDirection: c.driftDirection,
      spriteTop: c.baseY - c.renderHeight - c.amplitude,
    })),
    // 存檔狀態：驗收要能分辨「沒存進去」與「存了但沒還原」。
    storeAvailable: () => store.available,
    savedCount: () => store.loadAll().then((records) => records.length),
    savedIds: () => store.loadAll().then((records) => records.map((r) => r.artworkId)),
  };

  // 開場先放入幾位暖色調的示範人物，真的掃描結果進來時一樣加進同一個陣列。
  const DEMO_COLORS = {
    noah: [184, 118, 82], moses: [194, 151, 92], david: [185, 96, 72],
    daniel: [154, 116, 77], jonah: [105, 137, 123], shepherd: [202, 169, 111],
    angel: [232, 211, 158],
  };
  const imageCache = new Map();

  function loadImage(src) {
    if (imageCache.has(src)) return imageCache.get(src);
    const promise = new Promise((resolve, reject) => {
      const image = new Image();
      image.onload = () => resolve(image);
      image.onerror = () => reject(new Error('讀取人物素材失敗：' + src));
      image.src = src;
    });
    imageCache.set(src, promise);
    return promise;
  }

  function textureFromImageData(imageData) {
    const c = document.createElement('canvas');
    c.width = imageData.width; c.height = imageData.height;
    c.getContext('2d').putImageData(new ImageData(imageData.data, imageData.width, imageData.height), 0, 0);
    return c;
  }

  async function makeDemoTexture(species) {
    const [, , vw, vh] = species.viewBox.split(' ').map(Number);
    let maskCanvas;
    if (species.mask) {
      const image = await loadImage(species.mask);
      maskCanvas = document.createElement('canvas');
      maskCanvas.width = vw;
      maskCanvas.height = vh;
      maskCanvas.getContext('2d').drawImage(image, 0, 0, vw, vh);
    } else {
      const maskSvg = SvgRaster.nativeMaskSVG(species);
      maskCanvas = await SvgRaster.rasterizeSVGToCanvas(maskSvg, vw, vh);
    }
    const maskData = maskCanvas.getContext('2d').getImageData(0, 0, vw, vh);
    const color = Extract.solidColorImageData(vw, vh, DEMO_COLORS[species.id] || [200, 200, 200]);
    const merged = Extract.applyMaskToImageData(color, maskData);
    if (species.art) {
      const artImage = await loadImage(species.art);
      const artCanvas = document.createElement('canvas');
      artCanvas.width = vw;
      artCanvas.height = vh;
      artCanvas.getContext('2d').drawImage(artImage, 0, 0, vw, vh);
      const art = artCanvas.getContext('2d').getImageData(0, 0, vw, vh).data;
      for (let i = 0; i < merged.data.length; i += 4) {
        const luma = (art[i] * 0.299) + (art[i + 1] * 0.587) + (art[i + 2] * 0.114);
        if (luma < 205 && merged.data[i + 3] > 0) {
          merged.data[i] = 42;
          merged.data[i + 1] = 34;
          merged.data[i + 2] = 28;
        }
      }
    }
    const box = Extract.boundingBoxOfAlpha(merged, 20);
    if (!box) return null;
    const cropped = Extract.cropImageData(merged, box, 4);
    return textureFromImageData(cropped);
  }

  // 示範人物走同一個 manager，才會一起算進 15 位的 FIFO 名額。
  // 只補到「還原完之後剩下的空位」為止——孩子的作品優先於示範人物，
  // 塞滿再讓 FIFO 去擠的話，被擠掉的會是剛還原回來的真作品。
  async function seedDemoCreatures(slots) {
    for (const species of Species.SPECIES) {
      if (slots <= 0) return;
      const image = await makeDemoTexture(species);
      if (!image) continue;
      const result = manager.enqueue({
        artworkId: `demo-${species.id}`,
        speciesId: species.id,
        image,
        ts: 0,
        isDemo: true,
      });
      if (result === 'accepted') slots--;
    }
  }

  // 存進 IndexedDB 的作品，重新整理之後還原。
  //
  // 在這之前作品只活在這個分頁的記憶體裡：活動中不小心按到 F5、瀏覽器當掉、
  // 或電腦休眠後分頁被回收，孩子畫的東西就全部消失，而且沒有補救方式——
  // 原始的塗色紙早就還給孩子了。
  const store = ArtworkStore.createArtworkStore();

  function artworkFromMessage(msg, image) {
    return {
      artworkId: msg.artworkId, speciesId: msg.speciesId, image, ts: msg.ts,
    };
  }

  function decodeArtwork(msg) {
    return new Promise((resolve) => {
      const image = new Image();
      image.onload = () => resolve(artworkFromMessage(msg, image));
      image.onerror = () => resolve(null); // 圖壞了就當這一張沒有，不擋住其他張
      image.src = msg.textureDataURL;
    });
  }

  async function restoreSavedArtworks() {
    const saved = await store.loadAll();
    // 還原走的是跟即時掃描**同一個**驗證函式：存壞的、被改過的、或舊版格式的
    // 紀錄都會在這裡被擋下來，不會帶著壞資料進場。
    const usable = ArtworkStore.selectRestorable(
      saved.filter((record) => ArtworkMessage.isScannedArtworkMessage(record)),
      manager.maxCharacters,
    );
    let restored = 0;
    for (const msg of usable) {
      const work = await decodeArtwork(msg);
      if (work && manager.enqueue(work) === 'accepted') restored++;
    }
    return restored;
  }

  (async () => {
    let restored = 0;
    try {
      restored = await restoreSavedArtworks();
    } catch (error) {
      restored = 0; // 還原失敗就當作全新的一場，不能讓畫面開不起來
    }
    if (restored > 0) showToast(`已找回 ${restored} 張作品`);
    await seedDemoCreatures(manager.maxCharacters - restored);
    store.prune();
  })();

  function showToast(text) {
    toast.textContent = text;
    toast.classList.add('show');
    clearTimeout(showToast._t);
    showToast._t = setTimeout(() => toast.classList.remove('show'), 2600);
  }

  const channel = AquariumChannel.createChannel();
  channel.onMessage((msg) => {
    // 「開始新的一場」：先把存檔清乾淨**再**重新載入。順序反了的話，
    // 重新載入會把剛才那些作品原封不動地還原回來，等於沒清。
    if (ArtworkMessage.isResetMessage(msg)) {
      store.clear().then(() => window.location.reload());
      return;
    }

    // 先驗證訊息本身，再去載圖——壞掉的訊息不該占用名額，也不該淘汰場上角色。
    if (!ArtworkMessage.isScannedArtworkMessage(msg)) return;

    const img = new Image();
    img.onload = () => {
      const result = manager.enqueue(artworkFromMessage(msg, img));
      if (result === 'duplicate') return;
      // 存檔是背景動作：存不進去（配額滿、私密視窗）也照樣讓角色登場，
      // 只是重新整理之後找不回來而已。
      store.save(msg).then((ok) => { if (ok) store.prune(); });
      const species = Species.getSpecies(msg.speciesId);
      showToast(`${(species && species.emoji) || '📖'} ${(species && species.name) || '聖經人物'}來到聖經樂園了！`);
    };
    img.onerror = () => { /* 圖載不起來就當這次掃描沒發生，不占名額 */ };
    img.src = msg.textureDataURL;
  });

  let last = performance.now();
  let elapsed = 0;
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    elapsed += dt;

    walkable = Movement.getWalkableArea(canvas.width, canvas.height);
    sky = Flight.getSkyArea(canvas.width, canvas.height);
    manager.update(dt);

    // 地面與天空是兩個獨立的族群：地面角色只跟地面角色避讓，天使只跟天使讓開。
    // 混在一起算的話，天使會被當成地面上的障礙，草地反而更擠。
    const walkers = creatures.filter((c) => !c.isFlying);
    const flyers = creatures.filter((c) => c.isFlying);

    for (const flyer of flyers) {
      flyer.setMovement(Flight.driftFlyer(flyer, flyers, sky, dt));
      flyer.drivenByMovement = true;
    }

    for (const character of walkers) {
      // 到了目標、或是移動層回報走不動，就換一個新目標，形成持續的自由漫遊。
      // stalled 是必要的：角色可能安全地卡在一個所有方向都被擋住的口袋裡，
      // 這時牠不是 blocked（牠很安全），只是永遠到不了目標。沒有這個訊號，
      // 那一位會靜止到活動結束。
      const reached = Math.hypot(character.targetX - character.x, character.targetY - character.baseY) < 12;
      if (reached || character.stalled) {
        // 回報卡住時要挑一個**走得到**的目標。只保證安全的話，河對岸的點會被
        // 一選再選，角色朝著到不了的地方撞、卡住、再換一個對岸的點，原地打轉。
        // 抵達目標時用便宜的那個就好，不必每次都跑一趟 BFS。
        let target = character.stalled
          ? Movement.chooseReachableTarget(character, walkers, walkable)
          : Movement.chooseSafeTarget(character, walkers, walkable);
        // chooseSafeTarget 連續挑不到點時會退回「原地」。那等於沒有目標：
        // 下一幀又判定「抵達」、又挑一次，角色靜止不動，而 blocked 與 stalled
        // 都是 false——兩個處理分支都看不到牠，牠會靜止到活動結束。
        // 挑不到就當成卡住，改用會繞路的那一個。
        const sameSpot = Math.hypot(target.targetX - character.x, target.targetY - character.baseY) < 1e-6;
        if (sameSpot && !character.stalled) {
          target = Movement.chooseReachableTarget(character, walkers, walkable);
        }
        character.targetX = target.targetX;
        character.targetY = target.targetY;
      }
      // 已經卡住的角色不必每一幀都重跑完整搜尋——那是最貴的路徑，
      // 多位角色同時卡住會疊加成掉幀。隔一段時間再試一次就夠了。
      if (character.blocked) {
        character.blockedRetry = (character.blockedRetry || 0) - dt;
        if (character.blockedRetry > 0) continue;
        character.blockedRetry = 0.5;
      }
      // setMovement 會把移動層的整包狀態（含繞行認定與 blocked／stalled）帶回角色。
      character.setMovement(Movement.steerCharacter(character, walkers, walkable, dt));
      character.drivenByMovement = true;
    }

    AquariumScene.updateSheepFlock(sheepFlock, dt, walkable, walkers);
    AquariumScene.updateBirdFlock(birdFlock, dt, canvas.width, canvas.height);
    AquariumScene.updateBubbles(bubbles, dt, canvas.width, canvas.height);

    AquariumScene.drawBackground(ctx, canvas.width, canvas.height, elapsed);
    AquariumScene.drawCanopySway(ctx, canvas.width, canvas.height, elapsed);
    AquariumScene.drawBubbles(ctx, bubbles);
    AquariumScene.drawBirdFlock(ctx, birdFlock, elapsed, canvas.height);

    // 角色依腳底深度排序，較靠近畫面下方的畫在前面，形成自然的 2.5D 景深。
    const grounded = [
      ...creatures.map((item) => ({ kind: 'creature', baseY: item.baseY, item })),
      ...sheepFlock.map((item) => ({ kind: 'sheep', baseY: item.baseY, item })),
    ].sort((a, b) => a.baseY - b.baseY);
    for (const entry of grounded) {
      if (entry.kind === 'sheep') {
        AquariumScene.drawSheep(ctx, entry.item, elapsed, canvas.height);
        continue;
      }
      entry.item.update(dt, elapsed);
      entry.item.draw(ctx, elapsed);
    }

    AquariumScene.drawForeground(ctx, canvas.width, canvas.height, elapsed);

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
